spring.application.name=notification-service
server.port=0

# kafka setup
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.group-id=notificationId
# serializing key-value pair to object to send it to kafka (Serialization).
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Deserializing the object to get the json(de-serialization)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:org.ecom.notification.event.OrderPlacedEvent