spring.application.name=product-service
server.port=0
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/productService
spring.datasource.username=root
spring.datasource.password=root

# Hibernate DDL mode
spring.jpa.hibernate.ddl-auto=update

# Hibernate Dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Show SQL in console
spring.jpa.show-sql=true

# Format SQL
# Management + Tracing Settings
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# Zipkin Exporter Configuration (Note the new path: management.zipkin.tracing.endpoint)
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Logging pattern to see Trace/Span IDs in the console (Optional but recommended)
#logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]